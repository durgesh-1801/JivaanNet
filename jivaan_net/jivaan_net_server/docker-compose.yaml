services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: jivaan_net
      POSTGRES_PASSWORD: "pnrC0GZ4NV5bwnBAMGoF_t80rzQi86Mf"
    volumes:
      - jivaan_net_data:/var/lib/postgresql/data


  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: jivaan_net_test
      POSTGRES_PASSWORD: "4R51aUK625TWezmEKWr7PjGNHEq7EPzZ"
    volumes:
      - jivaan_net_test_data:/var/lib/postgresql/data


volumes:
  jivaan_net_data:
  jivaan_net_test_data:
